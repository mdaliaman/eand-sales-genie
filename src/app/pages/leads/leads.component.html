<div class="mx-auto max-w-5xl px-6 py-10">
  <h1 class="text-3xl font-extrabold">My Leads</h1>
  <p class="mt-1 text-muted-foreground">Assigned to you this week.</p>
  <div class="mt-8 overflow-hidden rounded-2xl border border-border bg-card shadow-soft">
    <table class="w-full text-sm">
      <thead class="bg-secondary text-left text-xs uppercase tracking-wide text-muted-foreground">
        <tr>
          <th class="px-5 py-3">Customer</th>
          <th class="px-5 py-3">Interest</th>
          <th class="px-5 py-3">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (l of leads; track l.name) {
          <tr class="border-t border-border">
            <td class="px-5 py-4 font-medium">{{ l.name }}</td>
            <td class="px-5 py-4 text-muted-foreground">{{ l.interest }}</td>
            <td class="px-5 py-4">
              <span class="rounded-full bg-accent px-3 py-1 text-xs font-semibold text-accent-foreground">
                {{ l.status }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
