<div class="flex h-[calc(100vh-0px)] flex-col lg:h-screen">
  <div class="flex items-center gap-3 border-b border-border bg-card px-6 py-4">
    <div class="flex size-10 items-center justify-center rounded-xl bg-brand-gradient">
      <lucide-angular [img]="icons.Bot" class="size-5 text-primary-foreground"></lucide-angular>
    </div>
    <div>
      <h1 class="text-lg font-bold">e&amp; Sales Genie</h1>
      <p class="text-xs text-muted-foreground">{{ t.subtitle }}</p>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <span class="hidden items-center gap-1 rounded-full bg-accent px-3 py-1 text-xs font-semibold text-accent-foreground sm:inline-flex">
        <lucide-angular [img]="icons.Sparkles" class="size-3"></lucide-angular>
        Beta
      </span>
      <label class="sr-only" for="langpick">{{ t.language }}</label>
      <select
        id="langpick"
        [ngModel]="lang.choice()"
        (ngModelChange)="onLanguageChange($event)"
        [ngModelOptions]="{ standalone: true }"
        class="h-9 rounded-lg border border-input bg-background px-2 text-xs font-medium focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
      >
        <option value="auto">{{ t.autoDetect }}</option>
        @for (o of lang.options; track o.code) {
          <option [value]="o.code">{{ o.label }}</option>
        }
      </select>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto px-4 py-6" [attr.dir]="lang.dir()">
    <div class="mx-auto flex max-w-3xl flex-col gap-4">
      @for (m of messages; track m.id) {
        <div class="flex gap-3" [class.flex-row-reverse]="m.role === 'user'">
          <div
            class="flex size-8 shrink-0 items-center justify-center rounded-full"
            [class.bg-brand]="m.role === 'bot'"
            [class.text-brand-foreground]="m.role === 'bot'"
            [class.bg-secondary]="m.role === 'user'"
          >
            @if (m.role === 'bot') {
              <lucide-angular [img]="icons.Bot" class="size-4"></lucide-angular>
            } @else {
              <lucide-angular [img]="icons.User" class="size-4"></lucide-angular>
            }
          </div>
          <div
            class="max-w-[80%] whitespace-pre-wrap rounded-2xl px-4 py-3 text-sm leading-relaxed"
            [class.rounded-tl-sm]="m.role === 'bot'"
            [class.border]="m.role === 'bot'"
            [class.border-border]="m.role === 'bot'"
            [class.bg-card]="m.role === 'bot'"
            [class.rounded-tr-sm]="m.role === 'user'"
            [class.bg-brand]="m.role === 'user'"
            [class.text-brand-foreground]="m.role === 'user'"
          >
            {{ m.text }}
          </div>
        </div>
      }
      @if (typing) {
        <div class="flex gap-3">
          <div class="flex size-8 items-center justify-center rounded-full bg-brand text-brand-foreground">
            <lucide-angular [img]="icons.Bot" class="size-4"></lucide-angular>
          </div>
          <div class="rounded-2xl rounded-tl-sm border border-border bg-card px-4 py-3 text-sm text-muted-foreground">
            {{ t.typing }}
          </div>
        </div>
      }
      <div #endRef></div>
    </div>
  </div>

  <div class="border-t border-border bg-card px-4 py-4">
    <div class="mx-auto max-w-3xl" [attr.dir]="lang.dir()">
      <div class="mb-3 flex flex-wrap gap-2">
        @for (s of t.suggestions; track s) {
          <button
            (click)="send(s)"
            class="rounded-full border border-border px-3 py-1.5 text-xs font-medium text-muted-foreground transition-colors hover:border-brand hover:text-brand"
          >
            {{ s }}
          </button>
        }
      </div>
      <form class="flex gap-2" (ngSubmit)="onSubmit()">
        <input
          [(ngModel)]="input"
          name="input"
          maxlength="1000"
          [placeholder]="t.placeholder"
          class="flex h-12 w-full rounded-xl border border-input bg-background px-3 py-2 text-sm shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring"
        />
        <app-button type="submit" size="lg" extraClass="h-12 rounded-xl px-5" [disabled]="typing">
          <lucide-angular [img]="icons.SendHorizonal" class="size-4"></lucide-angular>
        </app-button>
      </form>
    </div>
  </div>
</div>
